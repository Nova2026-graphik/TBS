# Veille automatique des dépendances.
#
# Sans elle, un avis de sécurité amont ne se découvre qu'au prochain
# `npm audit` lancé à la main — c'est ainsi que les quatre vulnérabilités
# élevées de l'issue #2 sont passées inaperçues.
#
# Le contrôle bloquant (`npm audit --audit-level=high`) est assuré par le
# travail `qualite` de `.github/workflows/ci.yml`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Les pull requests visent `develop`, jamais `main` : `main` reste l'état
    # livré au client et n'avance que par une fusion décidée. Sans cette ligne,
    # Dependabot ouvre sur la branche par défaut du dépôt.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Lome
    # Assez pour ne rien manquer, assez peu pour rester lisible.
    open-pull-requests-limit: 5
    labels:
      - securite
      - qualite-code
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
    groups:
      # Correctifs et versions mineures regroupés : une PR par semaine plutôt
      # que quinze. Les majeures restent séparées, elles se relisent une à une.
      mineures:
        update-types:
          - minor
          - patch

  # Les actions du workflow sont épinglées à une version majeure : Dependabot
  # suit les correctifs de sécurité qu'elles reçoivent, que rien d'autre ne
  # signalerait.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Lome
    labels:
      - qualite-code
    commit-message:
      prefix: 'ci'
