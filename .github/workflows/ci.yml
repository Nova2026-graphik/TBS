# Intégration continue.
#
# Rien ne vérifiait qu'une modification compile, passe les types, n'ouvre pas
# de vulnérabilité ni ne fait gonfler les pages : tout reposait sur une
# vérification manuelle avant chaque `git push`.
#
# Trois travaux, du plus rapide au plus lent : `qualite` arrête les erreurs en
# deux minutes, `parcours` rejoue les quatre chemins qui rapportent, et
# `performance` mesure sans bloquer — le temps de caler les seuils sur les
# relevés réels.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée annule la vérification en cours sur la même branche :
# inutile de payer deux fois pour un état dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      # `--if-present` : les scripts `lint` et `test` arrivent avec l'issue #16.
      # Sans cette garde, la CI échouerait sur les branches ouvertes avant elle
      # — et une fois le script en place, il s'exécute sans rien changer ici.
      - name: Lint
        run: npm run --if-present lint

      - name: Types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run --if-present test

      - name: Build
        run: npm run build

      # `--omit=dev` : seules comptent les dépendances réellement servies.
      - name: Audit de sécurité
        run: npm audit --audit-level=high --omit=dev

      - name: Conserver la sortie du build
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: .output
          retention-days: 3

  parcours:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: qualite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: Navigateur
        run: npx playwright install --with-deps chromium

      - name: Parcours
        run: npm run --if-present test:e2e

      # Le rapport ne sert qu'en cas d'échec : traces, captures et vidéos.
      - name: Conserver le rapport
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  performance:
    name: Budget de performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: qualite
    # Avertissement, pas verrou : les seuils de `lighthouserc.json` doivent
    # d'abord être calés sur plusieurs relevés réels. Promouvoir ce travail en
    # bloquant est une décision à prendre une fois les chiffres connus.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation
        run: npm ci

      - name: Récupérer la sortie du build
        uses: actions/download-artifact@v8
        with:
          name: output
          path: .output

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.x autorun

      - name: Conserver les relevés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
